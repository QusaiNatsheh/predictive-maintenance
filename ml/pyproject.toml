[project]
name = "pdm-ml"
version = "1.0.0"
description = "Failure prediction from engine sensor data, sensor replay simulator, and scoring service"
requires-python = ">=3.12"
license = { text = "LGPL-3.0-only" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.12"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
